services:
  db:
    image: postgres:16
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sms_password}
      POSTGRES_DB: ${POSTGRES_DB:-subscription_db}
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./03_scale_seed.sql:/docker-entrypoint-initdb.d/03_scale_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms_user} -d ${POSTGRES_DB:-subscription_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: brightloop_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sms_user}:${POSTGRES_PASSWORD:-sms_password}@db:5432/${POSTGRES_DB:-subscription_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      APP_URL: ${APP_URL:-http://localhost:5173}
      DEV_RETURN_RESET_TOKEN: ${DEV_RETURN_RESET_TOKEN:-1}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-billing@brightloop.test}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    container_name: brightloop_frontend
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/web
      - frontend_node_modules:/web/node_modules
    depends_on: [api]
volumes:
  pgdata:
  frontend_node_modules:
